  'Владелец приложения (бизнес-владелец системы) утверждает изменения — он понимает бизнес-влияние. IT внедряет и тестирует, но бизнес-авторизацию даёт Владелец приложения.',
  'Привилегированный аккаунт имеет повышенные права — например, системный администратор, DBA или root-доступ. Может изменять конфигурации, требует жёсткого контроля и мониторинга.',
  'IT Operations или Security team мониторят активность привилегированных аккаунтов через логи, SIEM и PAM-инструменты. Имеют техническую экспертизу для обнаружения подозрительных действий.',
  'Оптимальный дизайн контролей приложения: входной контроль (валидация ввода) + контроль обработки (правильность расчётов) + выходной контроль (проверка результатов) = комплексное покрытие.',
  'Память аудитора — не формальное доказательство. Формальные виды доказательств: системные логи, скриншоты, экспорт конфигурации, отчёты, документированные наблюдения.',
  'Без Change Management изменения кода и конфигурации происходят без утверждения, тестирования или документации — неконтролируемые деплои с возможными ошибками и уязвимостями.',
  'Обзоры доступа проверяют, соответствуют ли права пользователей текущим должностным обязанностям — обеспечивая принцип минимальных привилегий.',
  'Соответствие SLA — основной измеримый показатель того, выполнил ли вендор обязательства по контракту. PIR оценивает, достигла ли реализация своих целей.',
  'Физические средства контроля = осязаемые барьеры: замки на дверях, камеры, ключ-карты, охрана, клетки для серверов. Брандмауэры, пароли и шифрование = логические/технические контроли.',
  'Команда Cybersecurity/IT Security отвечает за применение политики паролей через техническую конфигурацию (системные настройки, GPO, IAM-инструменты). HR может владеть документом политики.',
  'HR exit report подтверждает факт увольнения; системный лог доступа подтверждает отключение аккаунта. Вместе они доказывают работу контроля. Фото и подписи не подтверждают отзыв IT-доступа.',
  'IT-зависимый ручной контроль (ITDM) выполняется человеком, но основан на системных данных — например, менеджер проверяет сгенерированный системой отчёт об исключениях.',
  'IT-политики должны периодически пересматриваться: технологии меняются, регуляции эволюционируют, угрозы появляются. Политика 2-летней давности может не учитывать текущие риски.',
  'Именные индивидуальные аккаунты = каждое действие можно отследить до конкретного человека. Общие, групповые или анонимные аккаунты уничтожают подотчётность.',
  'Члены совета директоров — не технические специалисты. Им нужна краткая высокоуровневая информация. Исполнительные дашборды с риск-индикаторами и трендами — оптимальный формат для совета.',
  'IT-аудиторский отчёт должен содержать: находки (что наблюдалось), оценку риска (воздействие/вероятность) и рекомендации (как исправить). Списки сотрудников, исходный код, бюджет — не части отчёта.',
  // G1 V1
  'При неожиданных результатах тестирования аудитор сначала исследует ПОЧЕМУ — выявляет переменные или условия, которые могли вызвать несоответствие, перед тем как делать выводы или эскалировать.',
  'Криптографическая проверка хеша генерирует уникальный отпечаток файла. Любое изменение меняет хеш. В сочетании с автоматическим отклонением обеспечивает и целостность, и полноту.',
  'Data integrity tests проверяют работу контролей на каждом этапе обработки. Тесты референциальной целостности проверяют связи в БД; тесты конвертации данных — точность преобразования.',
  'Recovery control (корректирующий) восстанавливает нормальную работу после сбоя. Восстановление сервера из резервных носителей устраняет последствия инцидента — это capability восстановления.',
  'Зрелый Change Management: ВСЕ изменения (не только критические) проходят формальное отслеживание, утверждение, тестирование и контролируемый деплой. Неформальные утверждения — признак незрелости.',
  // Image 6
  'Риск SSO: один скомпрометированный пароль открывает ВСЕ системы. Радиус поражения одной компрометации учётных данных максимален. Это ключевой компромисс SSO: удобство vs. концентрация риска.',
  'Мониторинг сбоев пакетных заданий — самый критичный контроль IT Operations. Необнаруженные сбои приводят к неполной обработке и проблемам с целостностью данных.',
  '2FA требует двух РАЗНЫХ типов факторов. Смарт-карта = то, что ИМЕЕШЬ; PIN = то, что ЗНАЕШЬ. Сканирование радужки + отпечаток = оба биометрические (один тип). ID + пароль = оба "то, что знаешь".',
  'Таблицы авторизации (ACL, конфигурации привилегий, членство в группах) определяют КТО что МОЖЕТ делать — это конфигурационные параметры, реализующие контроль доступа.',
  // Image 8
  'Планирование охвата аудита основывается на существенности — фокус усилий на областях с наибольшим риском и бизнес-влиянием. Существенность определяет, какие системы и контроли требуют наибольшего внимания.',
  'Без логирования активности привилегированных пользователей нет аудиторского следа — невозможно определить, кто и когда вносил изменения. Подотчётность полностью утрачена.',
  'Три основных типа контролей: Превентивные (останавливают события), Детективные (выявляют события после), Корректирующие (восстанавливают после события). Сдерживающие — не основная категория.',
  'FRS документирует, что система должна делать с точки зрения бизнеса — логику, правила и требуемое поведение. Runbooks — инструкции по деплою; Release notes — документируют изменения.',
  'Превентивные контроли останавливают вредоносные события до причинения ущерба — избегая затрат на устранение, репутационный ущерб и штрафы. Детективные контроли выявляют события УЖЕ после.',
  // New V2
  'IT-аудит независимо оценивает, правильно ли спроектированы и реально ли работают контроли. Оптимизация производительности и соответствие HR-политикам — вторичные результаты.',
  'Контроли Change Management требуют формальной авторизации, утверждения и документации перед изменениями — предотвращая несанкционированные модификации.',
  'Риск-ориентированный аудит начинается с выявления ключевых бизнес-процессов. Нельзя приоритизировать усилия или проектировать тесты, не зная, какие процессы важнее.',
  'SoD между разработкой и операциями: кодировщик не деплоит в продакшн — предотвращает несанкционированные изменения. Версионирование и логирование обнаруживают, но не предотвращают.',
  'Риск = Вероятность × Воздействие. Оба фактора вместе определяют реальный уровень риска. Количество сотрудников и бюджет — ресурсные ограничения, а не факторы риска.',
  'Компенсирующий контроль: внедряется, когда идеальный первичный контроль (например, SoD) недостижим из-за практических ограничений. Снижает риск, не устраняя его полностью.',
  'PIR оценивает, достигла ли система своих целей, фиксирует уроки и документирует слабые места контроля, обнаруженные после запуска — улучшает будущие проекты.',
  'Data Integrity = полнота + точность + согласованность. Availability = доступность; Confidentiality = защита от несанкционированного доступа.',
  'Активные аккаунты уволенных сотрудников = наиболее серьёзная находка в области контроля доступа. Создаёт немедленный, постоянный риск несанкционированного доступа.',
  'Логирование аудиторского следа записывает КТО, ЧТО, КОГДА и ОТКУДА изменял в продакшне — создавая запись подотчётности для всех изменений.',
  // Image 11
  'Комитет по управлению = надзор руководства за IT, обеспечение соответствия IT-стратегии бизнес-целям. Это и есть сама структура управления. Политики паролей — контроли, не индикаторы управления.',
  'Фокус аудита Change Management: были ли изменения формально утверждены, достаточно протестированы и правильно задокументированы? Эти три элемента — суть проверки.',
  'Walkthrough (прослеживание контроля) + inquiry (вопросы владельцу) — основные техники оценки ITGC для Design & Implementation. Затем тестирование операционной эффективности.',
  'Роль аудитора: независимая оценка — выявление IT-рисков и оценка адекватности контролей. Аудитор НЕ внедряет контроли, не утверждает их и не обучает сотрудников.',
  'Золотой стандарт для backup: шифрование (защита при краже носителя) + тестирование восстановления (доказательство работоспособности). Ни одного из них по отдельности недостаточно.',
  'Корректирующие контроли восстанавливают нормальную работу после события. DR/BCP контроли — корректирующие: они не предотвращают сбой, но обеспечивают восстановление систем.',
  'Три качества аудиторских доказательств: Достаточные (достаточное количество), Релевантные (напрямую связаны с тестируемым), Надёжные (системно-сгенерированные > от третьих лиц > от руководства).',
  'Разработчики с неограниченным доступом к продакшну могут изменять данные, код или конфигурации без авторизации и аудиторского следа — риск мошенничества и нарушения целостности.',
  'Триада CIA — основа информационной безопасности: Confidentiality (доступ только авторизованным), Integrity (точные, неизменённые данные), Availability (доступность при необходимости).',
  'Высокорисковые недостатки должны быть немедленно доведены до руководства — не только в финальном отчёте. Руководство должно оценить влияние и решить о компенсирующих мерах.',
  // Image 12
  'Отказы идентификации и аутентификации относятся к домену GITC Access Management — контроль доступа к программам и данным.',
  'Устав аудита — основополагающий документ, устанавливающий полномочия, охват и ответственность функции аудита. Процедуры и цели меняются по заданиям; устав определяет постоянный мандат.',
  'Перед эскалацией или рекомендациями аудитор проводит дополнительный анализ для понимания масштаба, частоты и характера обхода. Торопиться в комитет без полного понимания — преждевременно.',
  'Депонирование исходного кода (escrow): код хранится у нейтральной третьей стороны и передаётся предприятию при наступлении определённых условий (например, банкротство вендора). Особенно важно для стартапов.',
  'Риск-аппетит = готовность организации принимать риски в погоне за целями — решение уровня управления. Steering committee — высший орган IT-управления. Комитет аудита обеспечивает надзор.',
  'Нетестированный план реагирования на инциденты — теоретический документ, который может провалиться в реальных условиях. Ежегодное тестирование (табличные учения) валидирует реальную работоспособность плана.',
  // New V3
  'Главная цель IT-аудита = независимая верификация соответствия IT-процессов определённым требованиям (политикам, стандартам, законам). Это даёт уверенность в том, что IT управляется эффективно.',
  'ITGC = IT General Controls (IT Общие Контроли). "General" означает применимость ко всей IT-среде, а не к конкретному приложению. Не путать с IT Governance Controls или Information Technical Governance.',
  'Access management — ключевой процесс GITC, управляющий доступом ко всей IT-среде. Закупка оборудования, обслуживание клиентов и продажи — бизнес-процессы, не входящие в GITC.',
  'Business owner (бизнес-владелец) утверждает права доступа — он понимает, кому нужен доступ и зачем. HR управляет трудоустройством; IT предоставляет доступ; но решает кому — бизнес-владелец.',
  'Change Management контролирует изменения системы — гарантируя, что все изменения формально запрошены, утверждены, протестированы и задокументированы перед деплоем. Лицензии, зарплаты, маркетинг — не в зоне CM.',
  'Формальные аудиторские доказательства = скриншоты, системные логи, отчёты. Мнение аудитора, устные объяснения и презентации — не формальные доказательства. Доказательства должны быть задокументированы и объективны.',
  'Главная цель Backup & Recovery = обеспечить восстановление данных — гарантировать непрерывность бизнеса после потери данных, сбоя или катастрофы. Сокращение затрат и ускорение систем — вторичные эффекты.',
  'Least privilege = пользователи, системы и процессы получают только минимальные права, необходимые для выполнения рабочей функции. Ограничивает ущерб от компрометации и снижает риск инсайдерских угроз.',
  'Сопротивление внедрению EA лучше всего преодолевается демонстрацией конкретной ценности для бизнес-подразделений — как EA помогает ИМ достигать СВОИХ целей. Технические документы и мандаты создают больше сопротивления.',
  'ITGC контролирует надёжность IT-контрольной среды в целом — правильно ли управляется доступ, контролируются ли изменения, последовательны ли операции. Эта надёжность = основа доверия к ITAC.',
  'Принцип least privilege применяется к персоналу вендора так же, как к сотрудникам. Вендоры — внешние стороны с другим профилем риска; неограниченный доступ вендора — серьёзный риск безопасности.',
  'Команда Cybersecurity определяет и утверждает политику доступа — устанавливая правила, стандарты и требования к управлению доступом. Бизнес-владельцы утверждают индивидуальные права; Cybersecurity — рамочную политику.',
  'Без Change Management изменения систем происходят без авторизации, тестирования или документации — создавая неконтролируемые модификации, которые могут привести к ошибкам, уязвимостям и простоям.',
  'При проверке логов аудиторы анализируют события безопасности — ищут несанкционированные попытки доступа, аномальное поведение, нарушения политик и доказательства работы контролей.',
  'Контрольная среда — это основа всех внутренних контролей: политики, процедуры, организационная культура, этика и структура управления, формирующие дизайн и работу контролей. "Тон сверху".',
  'COBIT = Control Objectives for Information and Related Technologies — основной фреймворк IT governance и management. ISO 9001 = управление качеством; IFRS = стандарты финансовой отчётности; ITAR = экспортный контроль.',
  'Рецертификация = периодический обзор доступа, при котором бизнес-владельцы повторно подтверждают, что каждый пользователь всё ещё нуждается в текущих правах. Выявляет избыточный доступ, накопленный при смене ролей.',
  'Cybersecurity / IT Security отвечает за управление привилегированными аккаунтами — определяя кто получает привилегированный доступ, мониторя активность и применяя PAM-контроли.',
  'Инкрементальное нагрузочное тестирование, симулирующее пиковые объёмы транзакций = наиболее реалистичный подход, тестирующий систему в реальных бизнес-условиях при максимальной ожидаемой нагрузке.',
  'При увольнении главная IT-задача аудита = своевременная деактивация аккаунта — отключение учётных записей сразу, чтобы уволенный сотрудник не мог получить доступ. Баланс отпусков и зарплата — задачи HR.',
  'Логическая безопасность = программные контроли доступа: пароли, права, шифрование, брандмауэры, списки контроля доступа. Физические замки, пожарная защита и камеры = физические контроли.',
  'Аудит паролей проверяет соответствие сложности паролей: минимальная длина, сложность (заглавные буквы, цифры, символы), срок действия, требования к истории. Верифицирует, что технические настройки соответствуют политике.',
  'Хранение видеозаписей CCTV должно соответствовать собственным политикам безопасности организации И применимым правовым/регуляторным требованиям, которые варьируются по юрисдикциям. Нет универсального фиксированного срока.',
  'Валидация резервного копирования тестирует способность реально восстановить данные — подтверждая полноту, целостность и успешность восстановления. Проверка размера файла показывает, что бэкап существует, но не что он восстанавливаем.',
  'IT-зависимость = когда бизнес-процесс зависит от IT-автоматизации. Например, если расчёт процентов автоматизирован системой, процесс финансовой отчётности имеет IT-зависимость. Аудиторы выявляют зависимости для определения ITAC и GITC.',
  'Карточная и замковая система доступа = физический контроль (осязаемый барьер, требующий физического присутствия). Политика паролей = логический контроль; ERP-модуль = контроль приложения; Правило брандмауэра = сетевой/логический контроль.',
  'Walkthrough = пошаговый обзор, при котором аудитор прослеживает транзакцию или процесс от начала до конца, прося владельца контроля продемонстрировать каждый шаг. Подтверждает, что процесс работает, как задокументировано.',
  'Обзор привилегированного доступа проверяет, соответствуют ли привилегированные права каждого пользователя его текущей должностной роли. Выявляет избыточно привилегированные аккаунты (больше прав, чем требует работа).',

];

function pick(i,oi){if(ans[i]!==null)return;ans[i]=oi;if(oi===ALL[i].a)correct++;answered++;render();}
function setTopic(id){active=id;flashIdx=0;render();}
function reset(){ans=new Array(ALL.length).fill(null);correct=0;answered=0;flashIdx=0;render();}
function toggleStudy(){studyMode=!studyMode;render();}
function toggleRuQ(){showRuQ=!showRuQ;render();}
function toggleFlash(){flashMode=!flashMode;flashIdx=0;render();}
function flashNext(){if(flashIdx<flashVisible.length-1){flashIdx++;render();}}
function flashPrev(){if(flashIdx>0){flashIdx--;render();}}
render();
</script>
