<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f5f0;color:#1a1a1a;padding:1rem}
.header{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:1.2rem 1.4rem;margin-bottom:1rem}

.sub{font-size:13px;color:#666;margin-bottom:12px}

.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem}

.qc{background:#fff;border:1px solid #e0e0d8;border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:10px}
.qmeta{font-size:11px;color:#888;margin-bottom:5px;display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
.bkp{background:#fce8f0;color:#8f1040}
.bac{background:#fef0e0;color:#7a4a00}
.bam{background:#ece8fe;color:#4a3aa0}
.bcm{background:#e0f5ec;color:#0a6040}
.bop{background:#e0eeff;color:#104a90}
.bic{background:#fff0d8;color:#7a5000}
.bgc{background:#f0f0e8;color:#444}
.bit{background:#e8f0fe;color:#1a4fa0}
.vsrc{background:#e8f5e0;color:#2a6020;font-size:10px;padding:2px 6px;border-radius:5px}

.opts{display:flex;flex-direction:column;gap:7px}

.opt:hover{background:#f5f5f0}

.btn{padding:7px 16px;font-size:13px;border:1px solid #ccc;border-radius:8px;cursor:pointer;background:#fff}

  <h1>IT Audit — Полный банк вопросов с фото</h1>

<script>
const topics=[
  {id:'all',l:'Все темы'},
  {id:'bkp',l:'Backup & Recovery',b:'bkp'},
  {id:'ac',l:'App Controls / ITAC',b:'bac'},
  {id:'am',l:'Access Management',b:'bam'},
  {id:'cm',l:'Change Management',b:'bcm'},
  {id:'op',l:'IT Operations',b:'bop'},
  {id:'ic',l:'Interface Controls',b:'bic'},
  {id:'gc',l:'GITCs / Audit',b:'bgc'},
  {id:'it',l:'Config & Settings',b:'bit'},
];
const ALL=[
  {t:'bkp',src:'Variant 4',q:'Which of the following is the BEST way to ensure that backups are <b>viable and can be used for recovery</b>?',o:['Storing backup media in a secure off-site location','Encrypting backup data','Performing regular restore tests','Using multiple backup methods'],a:2,exp:'Only regular restore tests confirm the backup actually works. Storing off-site and encrypting protects the media but does not prove recoverability.'},
  {t:'bkp',src:'Variant 4',q:'Which scenario indicates <b>WEAK configuration management</b> controls?',o:['All changes to security parameters require dual approval','System operating with vendor default configurations and no baseline','All production settings stored in encrypted vault','Unauthorized access attempts are logged and alerted'],a:1,exp:'No baseline means the organization cannot detect unauthorized configuration changes. Running on vendor defaults is also a security risk.'},
  {t:'ac',src:'Variant 4',q:'An automated interest calculation in a loan system is BEST classified as:',o:['IT General Control','Manual Control','IT Application Control','Detective Control'],a:2,exp:'ITAC = automated control embedded in an application. Interest calculation runs automatically within the loan system — not a GITC (environment control) and not manual.'},
  {t:'bkp',src:'Variant 4',q:'An entity performs a daily backup of critical data and stores tapes offsite. The tapes are used to <b>restore files in case of disruption</b>. This is a:',o:['Preventive control','Management control','Corrective control','Detective control'],a:2,exp:'Corrective controls restore normal operations after an incident. Preventive controls stop incidents. Since backup restores after disruption, this is corrective.'},
  {t:'cm',src:'Variant 4',q:'Lack of segregation between <b>development and production administration</b> roles MOST likely creates which risk?',o:['Failure to meet service-level agreements','Ability to introduce and conceal unauthorized system changes','Reduction in business processing speed','Increased need for help desk support'],a:1,exp:'If one person can code and deploy to production, they can introduce unauthorized changes and conceal them. SoD between dev and prod is a core GITC.'},
  {t:'bkp',src:'Variant 4',q:'Which of the following is the MOST effective way to ensure the <b>security of backup data</b>?',o:['Encrypting backup data','Storing backup media in a secure location','Implementing access controls for backup systems','Regularly updating backup software'],a:0,exp:'Encryption protects the data itself — even if media is stolen, encrypted data cannot be read. Most effective security control for backup data.'},
  {t:'am',src:'Variant 4',q:'Which function should be <b>separated from the others</b> if SoD cannot be achieved in an automated system?',o:['Authorization','Reprocessing','Correction','Origination'],a:0,exp:'Authorization must be kept separate — it is the most powerful function (approving transactions). Without independent authorization, fraud risk is highest.'},
  {t:'ac',src:'Variant 2',q:'Which refers to providing <b>verification of data values during different stages of processing</b> for completeness of the transaction?',o:['Run-to-run totals','Job cost accounting','Limit checks','Validation checker'],a:0,exp:'Run-to-run totals verify that totals are consistent as data moves through each processing stage. Changes between steps detect completeness failures.'},
  {t:'cm',src:'Variant 2',q:'The purpose of <b>User Acceptance Testing (UAT)</b> is to:',o:['Validate system performance under high load','Confirm that implemented functionality meets business requirements and scenarios','Ensure code quality meets development standards','Validate cyber-resilience controls'],a:1,exp:'UAT tests whether the system meets business requirements — not technical performance or code quality. End users confirm it does what the business needs.'},
  {t:'gc',src:'Variant 2',q:'What is the best definition of <b>auditing</b>?',o:['Review of past history using evidence to tell the story','Forecasting compliance by a new system entering production','Precompliance assessment based on management intended design','Certification testing of system benefits or failures'],a:0,exp:'Auditing = independent, evidence-based examination of past events/processes. Backward-looking, objective, independent — not forecasting or pre-compliance.'},
  {t:'am',src:'Variant 2',q:'SoD is not practical; an employee performs both <b>computer operator and application programmer</b> functions. IS auditor should recommend:',o:['Automated logging of changes to development libraries','Additional staff to provide SoD','Procedures that verify only approved program changes are implemented','Access controls to prevent operator from making program modifications'],a:2,exp:'Compensating control: procedures requiring only approved changes are implemented, with evidence. Most practical when SoD cannot be achieved.'},
  {t:'ic',src:'Variant 2',q:'Lack of <b>reconciliation between two financial subsystems</b> MOSTLY results in:',o:['Bad user experience','Inaccurate balances and undetected transaction discrepancies','Slow interface processing','Need for manual documentation'],a:1,exp:'Without reconciliation, differences (missing transactions, duplicates, mapping errors) go undetected — leading to inaccurate financial balances.'},
  {t:'gc',src:'Variant 2',q:'An IS auditor finds something potentially <b>illegal</b> during a review. The IS auditor should:',o:['Disregard — beyond scope','Conduct a detailed investigation to aid authorities','Immediately notify the auditee of the finding','Seek legal advice before finishing the audit'],a:2,exp:'The auditor immediately notifies the auditee (management/audit committee). The auditor does not investigate crimes — that is for authorities. Report, do not ignore or independently investigate.'},
  {t:'bkp',src:'Variant 3',q:'Which backup scheme BEST protects against <b>ransomware</b>?',o:['Storage system replication','Storage system mirroring','Storage system snapshots','RAID-5'],a:2,exp:'Snapshots = point-in-time copies taken before the attack. Ransomware encrypts live data — replication and mirroring copy the encrypted data too. Snapshots can restore to a pre-attack state.'},
  {t:'bkp',src:'Variant 3',q:'What is the <b>primary purpose</b> of data restoration testing?',o:['To meet regulatory requirements','To prove bare metal restores can be performed','To see how long it takes to restore data','To ensure that backups are actually viable and being performed'],a:3,exp:'Restoration testing confirms backups actually work and data is recoverable. Without testing, a backup process may appear successful but fail when recovery is needed.'},
  {t:'ic',src:'Variant 3',q:'Which scenario indicates an <b>INEFFECTIVE</b> interface control?',o:['System generates exception reports for mismatched data','Destination system accepts files even if record counts differ','Hash totals are validated before load','Automated retry logic is enabled'],a:1,exp:'Accepting files despite record count differences = completeness control has failed. An effective interface control rejects or flags mismatches — not silently accepts them.'},
  {t:'op',src:'Variant 3',q:'A key weakness in <b>Computer Operations</b> is indicated when:',o:['Batch jobs are executed via scripts with no monitoring','A SOC monitors network traffic','Cloud resources autoscale','Developers submit enhancement requests'],a:0,exp:'Batch jobs with no monitoring = failures go undetected for hours. Effective IT Operations requires job scheduling with automated monitoring and alerting.'},
  {t:'bkp',src:'Variant 3',q:'What is the purpose of a <b>data backup and recovery plan</b>?',o:['To prevent unauthorized changes to systems','To train users on security practices','To ensure availability and recoverability of critical data in a disaster or outage','To reduce vulnerability assessment frequency'],a:2,exp:'Core purpose = business continuity — ensuring critical data can be restored and operations resumed after a disaster, outage, or data loss event.'},
  {t:'bkp',src:'Variant 3',q:'Backup capturing data changed since last full backup, <b>ignoring incremental backups</b>, is known as:',o:['Incremental backup','Differential backup','Full backup','Grandfather-father-son rotation'],a:1,exp:'Differential: all changes since last FULL backup, does NOT reset archive bit. Incremental: changes since last backup of any type, RESETS archive bit. Differential grows larger over time but restores faster.'},
  {t:'bkp',src:'Variant 1',q:'IS auditor reviewing <b>backup processing facilities</b> should be MOST concerned that:',o:['Adequate fire insurance exists','Regular hardware maintenance is performed','Offsite storage of transaction and master files exists','Backup processing facilities are fully tested'],a:3,exp:'Fully tested facilities confirm recoverability. Insurance and offsite storage are important, but only testing proves the facility can actually restore operations.'},
  {t:'gc',src:'Variant 1',q:'The <b>auditor\'s final opinion</b> is to be based on:',o:['Objectives and verbal statements made by management','Understanding of management\'s desired audit results','The audit committee\'s specifications','The results of evidence and testing'],a:3,exp:'Auditor opinion = based on objective evidence from testing. Not on what management says, wants, or what the audit committee specifies. Independence + evidence = foundation of audit conclusions.'},
  {t:'am',src:'Variant 1',q:'Which of the following is <b>NOT</b> an input authorization control?',o:['Signatures on source documents','Management review','Separation of duties','Sequence numbers'],a:3,exp:'Sequence numbers = completeness control (ensure no records missing). Authorization controls confirm a transaction is approved. Completeness ≠ authorization.'},
  {t:'bkp',src:'Variant 1',q:'Which backup method copies changed files <b>without resetting the archive bit</b>?',o:['Differential','Physical','Full','Partial'],a:0,exp:'Differential: copies changed files since last full backup, does NOT reset archive bit. Incremental: copies changed files AND resets archive bit. Archive bit reset = incremental; no reset = differential.'},
  {t:'ac',src:'Variant 1',q:'Which represents an <b>automated application control</b> rather than a manual control?',o:['Supervisor compares two reports and signs off','System validates invoice amount against predefined business rules','Finance reviews exceptions once a month','HR performs training on control awareness'],a:1,exp:'ITAC = runs automatically without human intervention. System checking invoices against rules = automated. All other options involve a human performing the action = manual.'},
  {t:'ac',src:'Variant 1',q:'Which data validation edit detects <b>transposition and transcription errors</b>?',o:['Check digit','Duplicate check','Validity check','Range check'],a:0,exp:'Check digit = calculated digit appended to a number. Transposing or mis-transcribing digits causes the check digit calculation to fail — detecting the error. Range checks = out-of-range values; validity = against allowed list.'},
  {t:'ic',src:'Variant 5',q:'Online banking transactions halt mid-processing. <b>Transaction processing integrity</b> is BEST ensured by:',o:['Database integrity checks','Validation checks','Input controls','Database commits and rollbacks'],a:3,exp:'Commits and rollbacks implement ACID properties — a transaction either completes fully (commit) or is entirely reversed (rollback). Prevents partial updates that corrupt data when processing is interrupted.'},
  {t:'ic',src:'Variant 5',q:'MOST effective control for <b>completeness of data transferred through an API interface</b>:',o:['Manual reconciliation','Checksum validation for each message batch','Archiving API logs monthly','Internal memo confirmation from system owner'],a:1,exp:'Checksum validation computes a hash at source and verifies at destination. Any data difference (missing, added, corrupted) causes checksum failure — automated, reliable completeness assurance.'},
  {t:'am',src:'Variant 5',q:'Which BEST describes a <b>preventive access control</b>?',o:['Daily review of audit logs','MFA requirement for privileged access','Monthly SoD analysis','Exception reporting'],a:1,exp:'Preventive = stops unauthorized actions before they occur. MFA prevents unauthorized login even if credentials are stolen. Audit logs and exception reports = detective controls (identify after the fact).'},
  {t:'am',src:'Variant 5',q:'IS auditor evaluating logical access controls should <b>FIRST</b>:',o:['Document controls applied to access paths','Test controls to determine if functional','Evaluate security environment vs written policies','Obtain understanding of security risks to information processing'],a:3,exp:'Audit methodology: understand risks first, then assess controls. Security risks drive scope and depth of access control testing.'},
  {t:'cm',src:'Variant 5',q:'The MAIN purpose of <b>migration controls</b> is to ensure:',o:['Developers can deploy changes quickly','Only authorized and tested components are moved to production','Cloud infrastructure is optimized','Operations team reduces workload'],a:1,exp:'Migration controls ensure only authorized and tested code enters production — preventing untested, modified, or unauthorized programs from affecting the live environment.'},
  {t:'ac',src:'Variant 5',q:'Which BEST describes an <b>IT Application Control (ITAC)</b>?',o:['Automated validation ensuring invoice amounts match contract terms','Firewall configuration','Anti-virus scanning','CCTV in server room'],a:0,exp:'ITAC = automated control embedded in a business application (invoice validation). Firewalls, anti-virus, CCTV = infrastructure/physical controls, not application-level business controls.'},
  {t:'gc',src:'Variant 1',q:'Control owner is asked to <b>describe the process</b> to the auditor. What type of auditing is taking place?',o:['Walkthrough','Interview','Document review','Reprocessing'],a:0,exp:'Walkthrough = auditor traces a process end-to-end, asking the control owner to walk through how it works step by step. Different from Interview (general Q&A) or Document review (examining written records alone).'},
  // --- NEW QUESTIONS FROM LATEST PHOTOS ---
  {t:'cm',src:'New photo 1',q:'A strong <b>SDLC (Software Development Life Cycle)</b> requires which key element?',o:['Defined requirements, testing, acceptance, and version control','Documentation reviewed only after deployment','Separate office for developers','Cloud infrastructure'],a:0,exp:'A strong SDLC requires all phases: defined requirements, testing, acceptance criteria, and version control. Without these, changes cannot be managed or validated before going to production. Documentation-after-deployment and cloud infra are not SDLC controls.'},
  {t:'am',src:'New photo 1',q:'What are the most important criteria when <b>reviewing job descriptions</b>?',o:['Job functions are defined and training is required','Clear authority is established and everyone knows who holds what roles','Vacations are mandated and job rotation is provided for','Performance is monitored and raises are based on defined goals'],a:1,exp:'Clear authority and defined roles ensure accountability and SoD. Knowing who is responsible for what is the foundation of access management and control design. Job rotation is a compensating control, not the primary criterion.'},
  {t:'ic',src:'New photo 1',q:'Which interface transfer control BEST ensures <b>completeness</b>?',o:['Record count comparison between source and destination','Checking whether file name matches expected pattern','Reviewing logs quarterly','Allowing users to re-upload files'],a:0,exp:'Record count comparison directly measures completeness — if the count of records sent equals the count received, no records were lost. File name matching ensures correct file was sent, but not that all records are present.'},
  {t:'cm',src:'New photo 1',q:'Which is a <b>program development control</b>?',o:['Code review and approval before merging','Finance approval','User survey','Server capacity planning'],a:0,exp:'Code review and approval before merging is a Change Management / SDLC control — it ensures only reviewed and authorized code enters the codebase. Finance approval and capacity planning are operational, not development controls.'},
  {t:'gc',src:'New photo 1',q:'An IS auditor imported data from the client\'s database. The next step — confirming <b>imported data is complete</b> — is performed by:',o:['Matching control totals of imported data to control totals of original data','Sorting the data to confirm same order as original','Reviewing printout of first 100 records from each','Filtering data by categories and matching to original'],a:0,exp:'Matching control totals (e.g., record counts, hash totals) of the imported vs. original data is the standard completeness verification technique. It confirms nothing was lost or added during import.'},
  {t:'cm',src:'New photo 1',q:'Which control BEST <b>prevents unauthorized configuration changes</b>?',o:['HR onboarding checklist','Segregation of duties between developers and system administrators','VPN-only access','Help desk approval'],a:1,exp:'SoD between developers and sysadmins ensures that the person who codes changes cannot also implement them in production. This prevents unauthorized configuration changes — a core Change Management and Configuration Control.'},
  {t:'it',src:'New photo 1',q:'<b>Password policy configuration</b> is classified as:',o:['Application-level logic','Configuration setting control','Development lifecycle activity','Operational control'],a:1,exp:'Password policy (complexity, expiration, lockout settings) is a Configuration Setting Control — it is a system-level setting that defines how the authentication mechanism behaves, not business logic or a development activity.'},
  {t:'gc',src:'New photo 1',q:'The <b>FIRST step</b> in managing the risk of a cyberattack is to:',o:['Assess the vulnerability impact','Evaluate the likelihood of threats','Identify critical information assets','Estimate potential damage'],a:2,exp:'Risk management always starts with identifying what needs to be protected — critical information assets. You cannot assess vulnerabilities, evaluate threats, or estimate damage until you know which assets are at risk and their value.'},
  {t:'ac',src:'Variant 2 Group 1',q:'When testing <b>automated controls</b>, WHICH evidence provides the highest level of assurance?',o:['Management explanation of how the system works','System-generated evidence demonstrating the control executing as designed','Screenshot sent by user','Auditor observation performed once'],a:1,exp:'System-generated evidence (logs, automated reports showing the control firing) is the strongest — it comes directly from the system without human intermediation. Management explanations and user screenshots can be manipulated or inaccurate.'},
  {t:'am',src:'Variant 2 Group 1',q:'Which condition BEST ensures <b>accountability for administrator activities</b>?',o:['Shared credentials stored in a vault','Named admin accounts with logged activity and periodic review','Developer access to production with restrictions','Password rotation every 30 days'],a:1,exp:'Named (individual) accounts with activity logging + periodic review ensures every admin action can be traced to a specific person. Shared credentials destroy accountability — you cannot determine who did what.'},
  {t:'am',src:'Variant 2 Group 1',q:'The MAIN risk of <b>shared privileged accounts</b> is:',o:['Complexity of managing passwords','Higher licensing costs','Increased ticket volume','Inability to attribute actions to a specific user'],a:3,exp:'Shared accounts eliminate individual accountability — when multiple people use the same account, you cannot determine who performed a specific action. This is critical for privileged accounts where actions can cause significant damage.'},
  {t:'gc',src:'Variant 2 Group 1',q:'Which is MOST clearly an <b>IT General Control (GITC)</b>?',o:['Automated calculation of discounts','Duplicate record prevention','Validation of input fields','User provisioning and deprovisioning'],a:3,exp:'User provisioning and deprovisioning is a GITC (Access Management) — it governs the IT environment across all applications. The other options are ITACs (Application Controls) embedded in specific applications.'},
  {t:'bkp',src:'Variant 2 Group 1',q:'Which backup scheme best protects against <b>ransomware</b>? (V2)',o:['Storage system replication','Storage system mirroring','Storage system snapshots','RAID-5'],a:2,exp:'Snapshots = point-in-time copies unaffected by ransomware that encrypts live data. Replication and mirroring copy the encrypted data in real time — useless for ransomware recovery. RAID-5 protects against hardware failure, not ransomware.'},
  {t:'gc',src:'Variant 2 Group 1',q:'Audit covers 6-month period, population = 1,800 transactions. Which <b>sampling methodology</b> is best suited?',o:['Examine client\'s control self-assessment (CSA)','Submit access requests and observe how performed','Request first 30 transactions from the auditee','Request first five transactions from each month in the audit period'],a:3,exp:'Stratified sampling (5 per month across 6 months) is best — it ensures representation across the entire audit period, not just the beginning. The first 30 transactions would all be from January, missing coverage of later months.'},
  {t:'am',src:'Variant 2 Group 1',q:'Auditing <b>employee termination controls</b> — the most important aspect to review is:',o:['Company staff are notified about the termination','All login accounts of the employee are terminated','Employee details removed from active payroll files','Company property provided to the employee has been returned'],a:1,exp:'Terminating all login accounts is the most critical IT control — active accounts of terminated employees create immediate unauthorized access risk. Payroll removal is important but an HR/financial control. Property return is operational.'},
  // === NEW QUESTIONS FROM 5 PHOTOS ===
  // Image 4 — new full variant Q1-Q10
  {t:'gc',src:'New variant',q:'The <b>key goal of IT audit</b> is to:',o:['Optimize marketing','Assess IT control effectiveness','Build new systems','Hire staff'],a:1,exp:'IT audit exists to independently assess whether IT controls are designed and operating effectively — not to build systems or manage HR. The output is an opinion on control effectiveness and associated risks.'},
  {t:'gc',src:'New variant',q:'<b>ITGC controls</b> normally include:',o:['Asset valuation','Logical access, change management, and computer operations','Payroll processing','HR analytics'],a:1,exp:'The three core GITC domains are: Logical Access Management, Change Management, and IT Operations (computer operations). Asset valuation and payroll are business process controls, not GITCs.'},
  {t:'am',src:'New variant',q:'Access to systems should be:',o:['Granted automatically','Approved by a business owner','Given to all developers','Permanent'],a:1,exp:'Access must be formally approved by the system/business owner based on job need (least privilege). Automatic, blanket, or permanent access violates core access management principles.'},
  {t:'am',src:'New variant',q:'A risk of <b>missing access termination</b> is:',o:['Increased productivity','Unauthorized access by a former employee','Higher audit score','None'],a:1,exp:'When access is not revoked upon termination, former employees retain the ability to log in — creating unauthorized access risk, potential data theft, or sabotage. This is one of the most common access management findings.'},
  {t:'gc',src:'New variant',q:'Which document <b>sets IT control requirements</b>?',o:['Security Policy','Employee Handbook','Expense Report','User Manual'],a:0,exp:'The Security Policy defines IT control requirements — what must be protected, who is responsible, and what controls are required. Employee handbooks cover HR; user manuals cover how-to guidance.'},
  {t:'am',src:'New variant',q:'Who <b>performs user access review</b>?',o:['IT Support','System Owner','End User','HR'],a:1,exp:'The System Owner (business owner of the system) performs access reviews — they know what roles are needed and who should have access. IT Support provisions access but should not independently decide who gets it.'},
  {t:'gc',src:'New variant',q:'Which of the following is <b>NOT an ITGC area</b>?',o:['Program Change Management','Access Security','Financial Reporting','Program Acquisition and Development'],a:2,exp:'Financial Reporting is a business process control area, not an ITGC. The four ITGC domains are: Access Management, Change Management, IT Operations, and Program Development/Acquisition.'},
  {t:'am',src:'New variant',q:'The principle of <b>Segregation of Duties (SoD) prevents</b>:',o:['Data backup','Conflict of interest','Software installation','Data entry errors'],a:1,exp:'SoD prevents conflict of interest — ensuring no single person has enough access to commit and conceal fraud or error. By splitting incompatible duties, any fraudulent action requires collusion between multiple people.'},
  {t:'cm',src:'New variant',q:'What is a <b>Change Log</b>?',o:['List of salary changes','Record of system modifications','Calendar file','User directory'],a:1,exp:'A Change Log is a formal record of all changes made to systems, applications, or infrastructure — capturing what changed, when, by whom, and why. It is essential for Change Management and audit trail purposes.'},
  {t:'gc',src:'New variant',q:'When implementing a <b>risk-based IT audit program</b>, which approach BEST ensures optimal coverage?',o:['Examine all systems regardless of risk profile','Rotate systems on a 5-year schedule','Audit based on technical complexity and team knowledge','Categorize IT assets by criticality and impact to business objectives'],a:3,exp:'Risk-based auditing prioritizes systems by their criticality and business impact — not by rotation schedules or technical complexity. High-risk, high-impact systems get more audit attention; low-risk systems less.'},
  // Images 2/3 — Q11-Q30
  {t:'gc',src:'New variant',q:'What is the <b>purpose of control testing</b>?',o:['Determine if control is designed and operating effectively','Replace IT staff','Prepare budget','Train users'],a:0,exp:'Control testing (Design & Implementation + Operating Effectiveness) determines whether a control was properly designed and whether it actually worked during the audit period. It is the core activity of IT audit fieldwork.'},
  {t:'it',src:'New variant',q:'<b>Password policy</b> should define:',o:['Complexity, expiry, and history','Username length only','Access levels','Work schedules'],a:0,exp:'A complete password policy must define: complexity requirements (length, characters), expiry period, and history (cannot reuse last N passwords). Username length and access levels are separate configuration items.'},
  {t:'gc',src:'New variant',q:'When implementing a <b>multi-layered defense strategy</b>, which component serves as the foundation for all other security measures?',o:['Comprehensive risk assessment','Implementation of complex technical controls across network infrastructure','Detailed documentation of security procedures','Regular security awareness training'],a:0,exp:'Comprehensive risk assessment is the foundation — you must first identify and prioritize risks before deciding which technical controls, documentation, or training to implement. Without risk assessment, controls are chosen blindly.'},
  {t:'gc',src:'New variant',q:'Which IT framework is used to <b>manage IT risks</b>?',o:['COBIT','IFRS','IAS','COSO only'],a:0,exp:'COBIT (Control Objectives for Information and Related Technologies) is the primary IT governance and risk management framework used in IT audit. IFRS and IAS are financial reporting standards; COSO is an internal control framework but not IT-specific.'},
  {t:'cm',src:'New variant',q:'Which <b>department approves system changes</b>?',o:['HR','Application Owner','Sales','Finance'],a:1,exp:'The Application Owner (business owner of the system) approves system changes — they understand the business impact. IT may implement and test, but the Application Owner provides business authorization. HR and Finance do not own IT systems.'},
  {t:'am',src:'New variant',q:'What is a <b>privileged account</b>?',o:['Account with elevated administrative rights','Guest account','Shared account','Expired user'],a:0,exp:'A privileged account has elevated rights — such as system administrator, database admin, or root access — beyond what regular users have. These accounts can make configuration changes and must be tightly controlled and monitored.'},
  {t:'am',src:'New variant',q:'Who should <b>monitor privileged account activity</b>?',o:['IT Operations / Security','HR','End user','Marketing'],a:0,exp:'IT Operations or the Security team monitors privileged account activity through log review, SIEM alerts, and PAM (Privileged Access Management) tools. They have the technical expertise to detect suspicious privileged actions.'},
  {t:'ac',src:'New variant',q:'Which approach best represents the <b>optimal design of application controls</b>?',o:['Controls only at the output phase','Integrating controls at the input, processing, and output stages','Deploying only automated controls with minimal human oversight','Implementing redundant controls at all levels regardless of risk'],a:1,exp:'Optimal application control design uses a layered approach: input controls (validate data entry), processing controls (ensure correct calculations), and output controls (verify results). Controls at all three stages provide comprehensive coverage.'},
  {t:'gc',src:'New variant',q:'Which is <b>NOT a control evidence type</b>?',o:['System log','Screenshot','Auditor\'s memory','Configuration export'],a:2,exp:'Auditor\'s memory is not formal evidence — it cannot be documented, reviewed, or relied upon. Formal evidence types include: system logs, screenshots, configuration exports, reports, and observation documentation. Memory alone has no audit value.'},
  {t:'cm',src:'New variant',q:'What happens if <b>Change Management is missing</b>?',o:['Systems become more secure','Uncontrolled code deployments','Lower costs','Automated rollback'],a:1,exp:'Without Change Management, code and configuration changes happen without approval, testing, or documentation — creating uncontrolled deployments that may introduce errors, security vulnerabilities, or unauthorized changes to production.'},
  {t:'am',src:'New variant',q:'<b>Access reviews</b> ensure that:',o:['All users have admin rights','Rights match job responsibilities','Passwords are visible','HR owns all accounts'],a:1,exp:'Access reviews verify that user rights are appropriate for current job roles — ensuring least privilege is maintained. Over time, users accumulate access that may no longer be needed; reviews identify and remove excess access.'},
  {t:'gc',src:'New variant',q:'During a <b>Post-Implementation Review (PIR)</b> for outsourced IT, which vendor performance aspect should be prioritized?',o:['Frequency of executive sponsor engagement','Adherence to contractual service level agreements','Documentation of all technical support interactions','Comparison of vendor staff qualifications vs. industry standards'],a:1,exp:'SLA adherence is the primary measurable indicator of whether the vendor delivered what was contracted. A PIR assesses whether the implementation met its objectives — SLAs define those objectives contractually.'},
  {t:'gc',src:'New variant',q:'<b>Physical security controls</b> include:',o:['Firewalls','Door locks and CCTV','Passwords','Encryption'],a:1,exp:'Physical security controls are tangible barriers — door locks, CCTV cameras, keycards, security guards, and cages for servers. Firewalls, passwords, and encryption are logical/technical controls, not physical ones.'},
  {t:'it',src:'New variant',q:'Who is responsible for <b>enforcing password policy</b>?',o:['Cybersecurity team','HR','Finance','Marketing'],a:0,exp:'The Cybersecurity / IT Security team is responsible for enforcing password policy through technical configuration (system settings, GPO, IAM tools). HR may own the policy document, but enforcement is a technical/security function.'},
  {t:'am',src:'New variant',q:'<b>Evidence of user termination control</b> could be:',o:['HR exit report and system access log','Employee photo','Expense sheet','Email signature'],a:0,exp:'The HR exit report confirms employment termination; the system access log confirms the account was disabled. Together they prove the control worked. Photos, expense sheets, and signatures do not evidence IT access removal.'},
  {t:'ac',src:'New variant',q:'What is an <b>IT-dependent manual control</b>?',o:['Manual review relying on system data','Automated control','Paper-based only','No control'],a:0,exp:'An IT-dependent manual control (ITDM) is performed manually by a person but relies on system-generated data — e.g., a manager reviewing a system-generated exception report. The human does the control, but the data comes from IT.'},
  {t:'gc',src:'New variant',q:'Why are <b>periodic reviews of IT policies</b> important?',o:['To ensure continued relevance and compliance','To delete documents','To satisfy auditors only','To reduce team workload'],a:0,exp:'IT policies must be reviewed periodically to ensure they remain current — technology changes, regulations evolve, and threats emerge. A policy that was adequate two years ago may no longer address current risks.'},
  {t:'am',src:'New variant',q:'Which ensures <b>accountability for privileged activity</b>?',o:['Shared credentials','Named individual accounts','Group logins','Anonymous access'],a:1,exp:'Named individual accounts ensure every action can be traced to a specific person. Shared, group, or anonymous access destroys accountability — when multiple people share credentials, no individual can be held responsible for specific actions.'},
  {t:'gc',src:'New variant',q:'Which <b>reporting technique</b> is most effective for highlighting critical security issues to the board of directors?',o:['Comprehensive narrative reports with full technical specifications','Executive dashboards with risk indicators and trend analysis','Statistical tables with full remediation history','Detailed audit logs with exhaustive evidence collections'],a:1,exp:'Board members are not technical experts — they need concise, high-level information. Executive dashboards with risk indicators and trends give them what they need to make governance decisions. Technical detail is for operational teams, not the board.'},
  {t:'gc',src:'New variant',q:'The <b>final IT audit report</b> should include:',o:['Findings, risk rating, and recommendations','Employee list','Source code','Budget summary'],a:0,exp:'An IT audit report must contain: findings (what was observed), risk rating (impact/likelihood), and recommendations (how to fix it). Employee lists, source code, and budgets are not components of an audit report.'},
  // === IMAGE 4: G1 V1 ===
  {t:'gc',src:'G1 V1',q:'IS auditor finds 50% of calculations do not match predetermined totals after a system modification. MOST likely next step:',o:['Design further tests of the calculations in error','Identify variables that may have caused test results to be inaccurate','Examine some test cases to confirm the results','Document results and prepare a report of findings'],a:1,exp:'When unexpected test results appear, the auditor first investigates WHY — identifying root cause variables before concluding or escalating. Jumping to a report without understanding the cause is premature.'},
  {t:'ic',src:'G1 V1',q:'Which control BEST ensures <b>integrity in a batch file-to-file interface</b>?',o:['Comparing record counts only','Cryptographic hash verification combined with rejection of mismatched files','Email notification that the file was received','Manual reconciliation performed weekly'],a:1,exp:'Cryptographic hash verification generates a unique fingerprint of the file — any change causes hash mismatch. Combined with automatic rejection, this ensures both integrity and completeness. Record count alone misses data corruption within records.'},
  {t:'ac',src:'G1 V1',q:'Which test type determines failures in <b>input, processing, or output controls</b> in an application?',o:['Referential integrity tests','Data conversion tests','Data integrity tests','Static data storage tests'],a:2,exp:'Data integrity tests verify that controls at each processing stage work correctly. Referential integrity tests check database relationships; data conversion tests check transformation accuracy.'},
  {t:'bkp',src:'G1 V1',q:'A server <b>reconstituted from backup media</b> is an example of which control type?',o:['Primary control','Manual control','Compensating control','Recovery control'],a:3,exp:'Recovery control (corrective) restores normal operations after a failure. Rebuilding a server from backup media corrects the disruption after it has occurred — this is a recovery capability by definition.'},
  {t:'cm',src:'G1 V1',q:'Which BEST demonstrates <b>mature Change Management</b>?',o:['Business testers approve changes informally','All changes are tracked, approved, tested, and migrated via automated deployment pipelines','Only critical changes require approval','Developers perform deployments during maintenance windows'],a:1,exp:'Mature Change Management: ALL changes (not just critical ones) go through formal tracking, approval, testing, and controlled deployment. Informal approvals and developer-led deployments indicate immaturity.'},
  // === IMAGE 6 ===
  {t:'am',src:'Image 6',q:'Organization installs <b>single sign-on (SSO)</b> for all systems. Management should be aware that:',o:['Maximum unauthorized access is possible if a password is disclosed','User authentication becomes more effective automatically','The security administrator workload will increase','User access rights will increase'],a:0,exp:'SSO risk: one compromised password unlocks ALL systems. The blast radius of a single credential compromise is maximized. This is the critical SSO trade-off — convenience vs. concentration of risk.'},
  {t:'op',src:'Image 6',q:'MOST critical control within <b>Computer Operations</b>:',o:['Reviewing payroll reports','Monitoring job failures and reruns for batch processes','Archiving UI forms','Archiving data storage'],a:1,exp:'Monitoring batch job failures is the most critical IT Operations control — undetected failures lead to incomplete processing and data integrity issues. Without this, operations is blind to processing failures.'},
  {t:'am',src:'Image 6',q:'Which satisfies <b>two-factor authentication (2FA)</b>?',o:['Iris scanning plus fingerprint scanning','Terminal ID plus global password','Smart card (something you HAVE) + user PIN (something you KNOW)','User ID along with password'],a:2,exp:'2FA requires two DIFFERENT factor types. Smart card = something you HAVE; PIN = something you KNOW. Iris + fingerprint = both biometrics (same factor type). User ID + password = both "something you know." Smart card + PIN is the classic 2FA combination.'},
  {t:'it',src:'Image 6',q:'IS auditor examining <b>OS configuration</b> to verify controls should review the:',o:['Transaction logs','Authorization tables','Audit logs','User activity reports'],a:1,exp:'Authorization tables (ACLs, privilege configurations, group memberships) define WHO can do WHAT — these are the configuration settings that implement access control. Logs show what happened; authorization tables show what is permitted.'},
  // === IMAGE 8 ===
  {t:'gc',src:'Image 8',q:'IS audit coverage planning should be based on:',o:['Parameter settings','Routing tables','Materiality','Professional skepticism'],a:2,exp:'Audit coverage is planned based on materiality — focusing effort on areas with highest risk and business impact. Materiality determines which systems and controls warrant the most attention given limited audit resources.'},
  {t:'am',src:'Image 8',q:'<b>Absence of logging for privileged users</b> creates which PRIMARY audit concern?',o:['Business continuity risks','Accountability and traceability of system activities cannot be ensured','Users may forget to follow procedures','Incorrect financial reporting'],a:1,exp:'Without logging privileged user activity, there is no audit trail — you cannot determine who made changes, when, or why. Accountability is completely lost, which is the primary concern for privileged access.'},
  {t:'gc',src:'Image 8',q:'Which is <b>NOT one of the three major control types</b>?',o:['Deterrent','Detective','Preventive','Corrective'],a:0,exp:'The three major control types: Preventive (stop events), Detective (identify events after they occur), Corrective (restore after event). Deterrent controls exist but are not one of the three primary IT audit categories.'},
  {t:'cm',src:'Image 8',q:'Which document MOST effectively <b>defines required logic and business rules</b> during system development?',o:['Deployment runbook','Functional requirements specification (FRS)','SOC 1 report','Release notes'],a:1,exp:'FRS documents what the system must do from a business perspective — the logic, rules, and behaviors required. Runbooks cover how to deploy; release notes document what changed; SOC 1 assesses service organization controls.'},
  {t:'gc',src:'Image 8',q:'Why are <b>preventive controls preferred</b> over detective controls?',o:['Easier to justify','Less expensive — they stop events before damage occurs','Detective controls stop events; preventive only records them','More visible to employees'],a:1,exp:'Preventive controls stop harmful events before damage occurs — avoiding remediation costs, reputational damage, and regulatory penalties. Detective controls identify events AFTER they happen — by then, damage is already done.'},
  // === IMAGE 10 ===
  {t:'gc',src:'New V2',q:'PRIMARY objective of an IT audit:',o:['Increase system performance','Assess control design and operating effectiveness','Verify compliance with HR policies','Optimize IT spending'],a:1,exp:'IT audit independently assesses whether controls are properly designed and actually working. Performance optimization and HR compliance are secondary outcomes, not the primary audit objective.'},
  {t:'cm',src:'New V2',q:'Which ITGC ensures <b>only authorized individuals can make system modifications</b>?',o:['Change management control','Physical access control','Business continuity planning','Data classification'],a:0,exp:'Change management controls require formal authorization, approval, and documentation before system modifications — preventing unauthorized changes.'},
  {t:'gc',src:'New V2',q:'FIRST step in a <b>risk-based IT audit</b>:',o:['Prepare audit report','Review control test plan','Interview management','Identify key business processes'],a:3,exp:'Risk-based auditing starts by identifying which business processes are most critical. You cannot prioritize audit effort or design tests until you know which processes matter most.'},
  {t:'cm',src:'New V2',q:'Most effective control to <b>prevent unauthorized program changes</b>:',o:['Version tracking','Change request logging','Segregation of duties between development and operations','End-user testing'],a:2,exp:'SoD between dev and ops means the coder cannot deploy to production — preventing unauthorized changes. Version tracking and logging detect changes but do not prevent them.'},
  {t:'gc',src:'New V2',q:'In assessing IT risk, which factor is MOST important?',o:['Probability and impact of potential threats','Number of audit staff','Budget available','Number of IT systems'],a:0,exp:'Risk = Probability × Impact. Both determine true risk level. Audit staff and budget are resource constraints, not risk factors.'},
  {t:'gc',src:'New V2',q:'BEST describes a <b>compensating control</b>:',o:['A redundant control','A temporary control','A control to mitigate a deficiency when primary control cannot be achieved','A control that replaces others entirely'],a:2,exp:'Compensating control: implemented when the ideal primary control (e.g., SoD) cannot be achieved due to practical constraints. It mitigates the risk without fully eliminating it.'},
  {t:'gc',src:'New V2',q:'Main purpose of a <b>post-implementation review (PIR)</b>:',o:['Evaluate project profitability','Confirm new system performance','Close financial accounts','Identify lessons learned and control weaknesses'],a:3,exp:'PIR assesses whether the system achieved its objectives, captures lessons learned, and documents control weaknesses discovered post go-live — improving future projects and strengthening controls.'},
  {t:'ic',src:'New V2',q:'Which control objective relates to <b>data completeness and accuracy</b>?',o:['Availability','Integrity','Confidentiality','Auditability'],a:1,exp:'Data Integrity = completeness + accuracy + consistency. Availability = accessible when needed; Confidentiality = protected from unauthorized access.'},
  {t:'am',src:'New V2',q:'MOST concern for IT auditor reviewing <b>access controls</b>:',o:['User accounts not disabled after termination','Passwords changed quarterly','Multi-factor authentication enabled','Limited administrator rights'],a:0,exp:'Active accounts of terminated employees = most serious access control finding. Creates immediate, ongoing unauthorized access risk with no legitimate business justification.'},
  {t:'cm',src:'New V2',q:'Control ensuring <b>accountability for production changes</b>:',o:['Incident reporting','Rollback testing','Audit trail logging','Patch notes'],a:2,exp:'Audit trail logging records WHO made WHAT changes, WHEN, and from WHERE — creating the accountability record for all production changes.'},
  // === IMAGE 11 ===
  {t:'gc',src:'Image 11',q:'BEST indicator of <b>effective IT governance</b>:',o:['Strong password policy','Centralized service desk','Formal IT policies','Existence of a steering committee'],a:3,exp:'A steering committee = senior management oversight of IT, ensuring alignment with business objectives. It IS the governance structure. Password policies and IT policies are controls, not governance indicators.'},
  {t:'cm',src:'Image 11',q:'In Change Management, auditor\'s main focus:',o:['Business satisfaction','Adequacy of approval, testing, and documentation','Technical performance','Budget efficiency'],a:1,exp:'Change Management audit: were changes formally approved, adequately tested, and properly documented? These three elements are what the auditor examines to determine if the change process is controlled.'},
  {t:'gc',src:'Image 11',q:'MOST appropriate testing for <b>ITGC effectiveness</b>:',o:['Walkthrough and inquiry','Sampling and survey','Analytical procedures','Regression testing'],a:0,exp:'Walkthrough (trace control end-to-end) + inquiry (ask control owner how it works) are primary ITGC assessment techniques for Design & Implementation. Then operating effectiveness testing samples transactions.'},
  {t:'gc',src:'Image 11',q:'Auditor\'s role in assessing controls:',o:['Implement mitigation measures','Approve internal controls','Identify and evaluate risk arising from IT','Train system administrators'],a:2,exp:'The auditor independently identifies IT risks and evaluates whether controls adequately address them. Auditors do NOT implement controls, approve them, or train staff — those are management responsibilities.'},
  {t:'bkp',src:'Image 11',q:'Key control for <b>backup management</b>:',o:['Weekly snapshot only','Encryption only','Retention without verification','Backups encrypted AND tested for restoration'],a:3,exp:'Gold standard: encryption (protects if media stolen) + tested for restoration (proves it works). Either alone is insufficient. Retention without testing is dangerous — you discover the failure when you need recovery most.'},
  {t:'bkp',src:'Image 11',q:'Control ensuring <b>critical systems resume after disruption</b>:',o:['Preventive','Corrective','Detective','Directive'],a:1,exp:'Corrective controls restore normal operations after an event. DR/BCP controls are corrective — they do not prevent the disruption but ensure systems can be restored. Preventive controls stop disruptions from happening.'},
  {t:'gc',src:'Image 11',q:'In an IT audit, evidence must be:',o:['Visual and verbal','Only quantitative','Sufficient, relevant, and reliable','Signed by management'],a:2,exp:'Three qualities: Sufficient (enough quantity), Relevant (directly relates to what is tested), Reliable (trustworthy source — system-generated > third-party > management-provided). Universal ISACA/IIA standard.'},
  {t:'am',src:'Image 11',q:'Primary IT risk when <b>developers have unrestricted production access</b>:',o:['Unauthorized data modification','Lack of training','Budget overrun','Project delay'],a:0,exp:'Developers with unrestricted production access can modify data, code, or configurations without authorization or audit trail — both a fraud risk and an integrity risk.'},
  {t:'gc',src:'Image 11',q:'Key objective of <b>information security management</b>:',o:['Efficiency and automation','High data availability only','Speed of processing','Confidentiality, Integrity, and Availability (CIA)'],a:3,exp:'CIA triad is the foundation of information security: Confidentiality (authorized access only), Integrity (accurate, unaltered data), Availability (accessible when needed). All security controls protect one or more of these.'},
  {t:'gc',src:'Image 11',q:'Auditor\'s BEST response when <b>high-risk deficiency</b> is identified:',o:['Reassign responsibility','Report immediately to management','Ignore until next audit','Document and archive only'],a:1,exp:'High-risk deficiencies must be reported to management immediately — not at the final report alone. Management needs prompt notification to assess impact and decide on compensating controls.'},
  // === IMAGE 12 ===
  {t:'am',src:'Image 12',q:'RAFIT: "Identification and authentication not implemented to restrict access." Which ITGC process?',o:['Access to programs and data','Program changes','Program acquisition and development','Computer operations'],a:0,exp:'Identification and authentication failures fall under the Access Management GITC domain — controlling access to programs and data.'},
  {t:'gc',src:'Image 12',q:'An audit charter should:',o:['Be dynamic and change with technology trends','State audit objectives and delegation of authority for internal controls','Document audit procedures for planned objectives','Outline overall authority, scope, and responsibilities of the audit function'],a:3,exp:'The audit charter is the foundation document establishing the audit function\'s authority, scope, and responsibilities — its permanent mandate. Procedures and objectives change per engagement; the charter defines the standing of the audit function.'},
  {t:'am',src:'Image 12',q:'IS auditor finds access requests that <b>bypassed normal authorization workflow</b>. Should:',o:['Perform additional analysis','Report to audit committee','Conduct a security risk assessment','Recommend IDM system owner fix the workflow'],a:0,exp:'Before escalating or recommending, the auditor performs additional analysis to understand scope, frequency, and nature. Jumping to the audit committee or recommending fixes without full understanding is premature.'},
  {t:'gc',src:'Image 12',q:'Enterprise outsources software dev to a startup. To protect software investment, IS auditor recommends:',o:['Due diligence on the vendor','Quarterly audits of vendor facilities','Source code escrow agreement','High penalty clause in contract'],a:2,exp:'Source code escrow: code held by a neutral third party, released to enterprise if vendor fails. Most direct protection for software investment — especially critical with a startup where business failure risk is elevated.'},
  {t:'gc',src:'Image 12',q:'Enterprise\'s <b>risk appetite</b> is BEST established by:',o:['Chief legal officer','Security management','Audit committee','Steering committee'],a:3,exp:'Risk appetite = how much risk the organization accepts pursuing its objectives — a governance decision by senior leadership. The steering committee is the highest IT governance body. Audit committee provides oversight; security management implements risk decisions.'},
  {t:'gc',src:'Image 12',q:'PRIMARY concern when evaluating an <b>incident response plan</b>:',o:['Plan approved by executive management','Plan is tested annually','Roles and responsibilities are clearly defined','Plan includes contact info for all employees'],a:1,exp:'An untested incident response plan is theoretical — it may look complete but fail under real conditions. Annual testing (tabletop exercises, simulations) validates whether the plan actually works. Approval and defined roles are necessary but secondary to proven effectiveness.'},
  // === NEW VARIANT (Images 10-16) ===
  {t:'gc',src:'New V3',q:'What is the <b>primary objective of an IT audit</b>?',o:['Increase company revenue','Verify compliance of IT processes with defined requirements','Configure servers','Increase user base'],a:1,exp:'The primary objective of IT audit is to independently verify that IT processes comply with defined requirements — policies, standards, laws, and control frameworks. This provides assurance that IT is managed effectively and risks are controlled.'},
  {t:'gc',src:'New V3',q:'What does <b>ITGC</b> stand for?',o:['IT Governance Controls','IT General Controls','Information Technical Governance','Internal Technology Guidelines'],a:1,exp:'ITGC = IT General Controls. These are controls that apply across the entire IT environment — not specific to one application. They include Access Management, Change Management, and IT Operations. "General" means they affect all systems broadly.'},
  {t:'gc',src:'New V3',q:'Which process is part of <b>IT General Controls</b>?',o:['Equipment purchasing','Access management','Customer service','Sales operations'],a:1,exp:'Access management is a core GITC domain — it governs who can access systems across the entire IT environment. Equipment purchasing and customer service are business process controls, not GITCs.'},
  {t:'am',src:'New V3',q:'Who approves <b>user access rights</b>?',o:['Project manager','HR department','Business owner','System administrator alone'],a:2,exp:'The Business Owner (system/data owner) approves access rights — they understand what roles need access and for what purpose. HR manages employment; IT provisions access; but the Business Owner decides who gets what access based on business need.'},
  {t:'cm',src:'New V3',q:'What does <b>Change Management</b> control?',o:['License usage','System modifications','Salaries','Marketing campaigns'],a:1,exp:'Change Management controls system modifications — ensuring all changes to IT systems are formally requested, approved, tested, and documented before deployment to production. It prevents unauthorized or untested changes from causing disruptions.'},
  {t:'gc',src:'New V3',q:'What qualifies as <b>audit evidence</b>?',o:['Auditor\'s opinion','Screenshots, logs, and reports','Verbal explanations','Presentations'],a:1,exp:'Formal audit evidence = screenshots, system logs, reports, configuration exports, signed approvals. Verbal explanations and opinions are not formal evidence — they can be forgotten or disputed. Evidence must be documented, objective, and reproducible.'},
  {t:'bkp',src:'New V3',q:'What is the main goal of <b>Backup & Recovery controls</b>?',o:['Reduce operational costs','Ensure data restoration','Speed up systems','Optimize code'],a:1,exp:'The primary goal of Backup & Recovery controls is to ensure data can be restored — guaranteeing business continuity after data loss, system failure, or disaster. Cost reduction and speed are secondary benefits, not the main objective.'},
  {t:'am',src:'New V3',q:'What does the <b>"least privilege" principle</b> mean?',o:['Grant maximum access','Provide only necessary access rights','Allow admin rights to all','Enable open access'],a:1,exp:'Least privilege = users, systems, and processes receive only the minimum access rights needed to perform their job function — nothing more. This limits the blast radius of a compromise and reduces insider threat risk.'},
  {t:'gc',src:'New V3',q:'What is the MOST effective way to address resistance to <b>Enterprise Architecture (EA) adoption</b> from business units?',o:['Demonstrating how EA supports specific business unit goals and objectives','Creating detailed technical documentation explaining long-term architectural benefits','Implementing centralized governance where all decisions require executive approval','Mandating compliance through formal policy enforcement and senior management reviews'],a:0,exp:'Resistance to EA adoption is best overcome by showing business units the direct value — how EA helps THEM achieve their specific goals. Technical documentation and mandates create more resistance; demonstrating personal benefit drives adoption.'},
  {t:'gc',src:'New V3',q:'What do <b>ITGC controls</b> test?',o:['Employee vacation tracking','Reliability of IT controls','Equipment performance','Sales forecasts'],a:1,exp:'ITGC controls test the reliability of the overall IT control environment — whether access is properly managed, changes are controlled, and operations are consistent. This reliability is the foundation for trusting application-level controls (ITACs).'},
  {t:'am',src:'New V3',q:'Primary reason for <b>segregating vendor personnel access rights</b> when onboarding a new IT service provider?',o:['Ensure vendor performance metrics align with contractual obligations','Establish a vendor management framework for all organizational levels','Implement the principle of least privilege for vendor staff','Create documentation of vendor activities across multiple environments'],a:2,exp:'Least privilege applies to vendor staff just as it does to employees — vendors should only access what they need to perform their contracted service. Unrestricted vendor access is a major risk: vendors are external parties with different risk profiles.'},
  {t:'am',src:'New V3',q:'Who <b>defines and approves access policy</b>?',o:['Cybersecurity team','HR','Finance','Any user'],a:0,exp:'The Cybersecurity team (Information Security) defines and approves the access policy — establishing the rules, standards, and requirements for access management. Business owners approve individual access rights; Cybersecurity defines the policy framework.'},
  {t:'cm',src:'New V3',q:'What risk arises <b>without Change Management</b>?',o:['Higher performance','Uncontrolled system changes','Better security','Faster testing'],a:1,exp:'Without Change Management, system changes happen without authorization, testing, or documentation — creating uncontrolled modifications that can introduce errors, security vulnerabilities, and outages. There is no oversight or accountability for what changes in production.'},
  {t:'gc',src:'New V3',q:'What is done when <b>auditors review logs</b>?',o:['Delete them','Analyze security events','Rewrite them','Ignore them'],a:1,exp:'When auditors review logs, they analyze security events — looking for unauthorized access attempts, anomalous behavior, policy violations, and evidence that controls are operating as intended. Log review is a key detective control and audit evidence source.'},
  {t:'gc',src:'New V3',q:'What is the <b>control environment</b>?',o:['Server room','Set of policies and procedures','Software','Password file'],a:1,exp:'The control environment is the foundation of all internal controls — it consists of the policies, procedures, organizational culture, ethics, and governance structures that shape how controls are designed and operated. It is the "tone from the top."'},
  {t:'gc',src:'New V3',q:'Which framework <b>defines IT governance and management</b>?',o:['ISO 9001','COBIT','IFRS','ITAR'],a:1,exp:'COBIT (Control Objectives for Information and Related Technologies) is the primary framework for IT governance and management. ISO 9001 = quality management; IFRS = financial reporting standards; ITAR = export control regulations.'},
  {t:'am',src:'New V3',q:'What does <b>"recertification"</b> mean in access management?',o:['Resetting passwords','Revalidating and confirming access rights','Deleting users','Adding new accounts'],a:1,exp:'Recertification = periodic access review where business owners revalidate that each user still needs their current access rights. Users\' roles change over time; recertification catches excess access accumulated through role changes, promotions, or project assignments.'},
  {t:'am',src:'New V3',q:'Who is responsible for <b>privileged account management</b>?',o:['Finance','Cybersecurity / IT Security','End user','HR'],a:1,exp:'Cybersecurity / IT Security team is responsible for privileged account management — defining who gets privileged access, monitoring privileged activity, enforcing PAM controls, and reviewing privileged account usage. This requires technical expertise that Finance and HR do not have.'},
  {t:'op',src:'New V3',q:'MOST effective way to evaluate <b>hardware capacity requirements</b> during system implementation testing?',o:['Conducting incremental load testing that simulates peak transaction volumes','Running stress tests pushing all components to 150% capacity simultaneously','Measuring response time under typical workloads and extrapolating on linear growth models','Analyzing historical usage patterns and adding a 25% buffer for anticipated growth'],a:0,exp:'Incremental load testing simulating actual peak volumes is the most realistic and effective approach — it tests how the system behaves under real business conditions at maximum expected load, identifying bottlenecks before go-live.'},
  {t:'am',src:'New V3',q:'What should auditors verify during <b>employee termination</b>?',o:['Vacation balance','Timely account deactivation','Salary transfer','Bonus calculation'],a:1,exp:'Timely account deactivation is the primary IT audit concern during termination — ensuring login accounts are disabled promptly so the terminated employee cannot access systems. Vacation balances, salaries, and bonuses are HR/payroll concerns, not IT audit concerns.'},
  {t:'am',src:'New V3',q:'<b>Logical security</b> refers to:',o:['Physical locks','Software access control','Fire protection','Camera monitoring'],a:1,exp:'Logical security = software-based access controls — passwords, permissions, encryption, firewalls, access control lists. Physical locks, fire protection, and cameras are physical security controls. Logical vs. physical is a fundamental IT security classification.'},
  {t:'it',src:'New V3',q:'What is checked during a <b>password audit</b>?',o:['User count','Password complexity compliance','Server name','Backup status'],a:1,exp:'Password audit checks whether passwords comply with the policy: minimum length, complexity (uppercase, numbers, symbols), expiry period, history requirements. It verifies the technical settings enforce what the policy requires.'},
  {t:'gc',src:'New V3',q:'When implementing <b>CCTV systems</b> as part of physical security, recommended practice for footage retention is:',o:['Store footage aligned with organizational security policies and regulatory requirements','Dynamic storage that auto-deletes after security personnel review','Always store exactly 90 days as mandated by international standards','Maintain indefinite archive in multiple geographic locations'],a:0,exp:'CCTV retention should align with the organization\'s own security policies AND applicable legal/regulatory requirements — which vary by jurisdiction and industry. Fixed periods (90 days) or indefinite retention are not universally mandated; policy and regulation should drive the decision.'},
  {t:'bkp',src:'New V3',q:'What is tested during <b>backup validation</b>?',o:['File size','Ability to restore data','Software version','Network latency'],a:1,exp:'Backup validation tests the ability to actually restore data — confirming that the backup is complete, uncorrupted, and can be successfully recovered. File size checks that the backup exists; only a restore test proves the data is actually recoverable.'},
  {t:'ac',src:'New V3',q:'What is an <b>IT dependency</b>?',o:['Automation of part of a financial process','Paper-based accounting','Manual reporting','No reliance on IT'],a:0,exp:'An IT dependency = when a business process relies on IT automation to function. For example, if interest calculation is automated by a system, the financial reporting process has an IT dependency. Auditors identify IT dependencies to determine which ITACs and GITCs are relevant.'},
  {t:'gc',src:'New V3',q:'Which is a <b>physical IT control</b>?',o:['Password policy','Card and lock access system','ERP module','Firewall rule'],a:1,exp:'Card and lock access system = physical control (tangible barrier requiring physical presence). Password policy = logical control; ERP module = application control; Firewall rule = technical/logical network control. Physical controls protect against physical access.'},
  {t:'gc',src:'New V3',q:'What is a <b>"walkthrough"</b> in IT audit?',o:['Step-by-step process review','Server maintenance','Report writing','Code debugging'],a:0,exp:'Walkthrough = a step-by-step review where the auditor traces a transaction or process from initiation to completion, asking the control owner to demonstrate each step. It verifies that the process works as documented and that controls are actually in place.'},
  {t:'am',src:'New V3',q:'What does a <b>privileged access review</b> check?',o:['Seniority','Privilege alignment with job role','Attendance','Email usage'],a:1,exp:'Privileged access review checks whether each user\'s privileged access aligns with their current job role and responsibilities. It identifies over-provisioned accounts (people with more access than their job requires) — a key outcome of periodic access reviews.'},
  {t:'gc',src:'New V3',q:'MOST effective technique for evaluating <b>control design after significant business process changes</b>?',o:['Risk-based assessment mapping updated processes to existing controls','Continuous monitoring while gradually implementing enhancements based on user feedback','Automated testing procedures before finalizing design changes for regulatory compliance','Documentation of previous controls compared with industry best practices'],a:0,exp:'After significant process changes, a risk-based assessment that maps the new/updated processes to existing controls identifies gaps — where process changes created unaddressed risks. This is more targeted and effective than generic monitoring or documentation exercises.'},

function getBadge(t){const tp=topics.find(x=>x.id===t);return tp&&tp.b?`<span class="badge ${tp.b}">${tp.l}</span>`:''}

function render(){
  // Controls bar
  const ctrlHtml=`
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.75rem;align-items:center">
      <button class="btn${studyMode?' active-mode':''}" onclick="toggleStudy()" title="Режим обучения: ответ виден сразу">📖 ${studyMode?'Режим теста':'Режим обучения'}</button>
      <button class="btn${showRuQ?' active-mode':''}" onclick="toggleRuQ()">🇷🇺 ${showRuQ?'Скрыть перевод вопроса':'Перевод вопроса'}</button>
      <button class="btn${flashMode?' active-mode':''}" onclick="toggleFlash()">🃏 ${flashMode?'Все вопросы':'Карточки'}</button>
      <span style="font-size:12px;color:#888;margin-left:4px">${studyMode?'📖 Ответ виден сразу':''}</span>
    </div>`;
  document.getElementById('fr').innerHTML=
    topics.map(t=>`<button class="fb${active===t.id?' on':''}" onclick="setTopic('${t.id}')">${t.l}</button>`).join('')+ctrlHtml;

  const allVisible=ALL.map((q,i)=>({q,i})).filter(({q})=>active==='all'||q.t===active);
  flashVisible=allVisible;

  let visible=allVisible;
  if(flashMode) visible=allVisible.length?[allVisible[Math.min(flashIdx,allVisible.length-1)]]:[]; 

  document.getElementById('qs').innerHTML=(flashMode?`<div style="text-align:center;font-size:13px;color:#666;margin-bottom:.5rem">Карточка ${Math.min(flashIdx+1,allVisible.length)} из ${allVisible.length} &nbsp;
    <button class="btn" onclick="flashPrev()" ${flashIdx===0?'disabled':''}>← Назад</button>
    <button class="btn" onclick="flashNext()" ${flashIdx>=allVisible.length-1?'disabled':''}>Вперёд →</button>
  </div>`:'')
  +visible.map(({q,i})=>{
    const sel=studyMode?q.a:ans[i];
    const revealed=sel!==null;
    return`<div class="qc">
      <div class="qmeta">${getBadge(q.t)}<span class="vsrc">${q.src}</span><span style="font-size:10px;color:#888">#${i+1}</span></div>
      ${showRuQ&&QRU[i]?`<div style="font-size:12px;color:#666;font-style:italic;margin-bottom:6px;padding:4px 8px;background:#f0f0e8;border-radius:6px">🇷🇺 ${QRU[i]}</div>`:''}
      <div class="qt">${q.q}</div>
      <div class="opts">${q.o.map((o,oi)=>{
        let c='opt';
        if(revealed){if(oi===q.a)c+=' rc';else if(oi===sel&&sel!==q.a)c+=' wr';}
        return`<div class="${c}" onclick="${studyMode?'':'pick('+i+','+oi+')'}">${studyMode&&oi===q.a?'✓ ':''}<span class="ol">${String.fromCharCode(65+oi)})</span>${o}</div>`;
      }).join('')}</div>
      ${KT[i]?`<div style="margin-top:8px;padding:6px 10px;background:#fffbe6;border-left:3px solid #f0c040;border-radius:0 6px 6px 0;font-size:12px;color:#7a5800"><strong>💡 Запомни:</strong> ${KT[i]}</div>`:''}
      <div class="exp" style="${revealed?'display:block':'display:none'}">
        <div style="margin-bottom:6px"><strong>🇬🇧</strong> ${q.exp}</div>
        ${RU[i]?`<div style="padding-top:7px;border-top:1px dashed #ccc;color:#333"><strong>🇷🇺</strong> ${RU[i]}</div>`:''}
      </div>
    </div>`;
  }).join('');

  // Score
  const realAnswered=ans.filter(x=>x!==null).length;
  const realCorrect=ans.reduce((s,a,i)=>a===ALL[i].a?s+1:s,0);
  document.getElementById('sc').textContent=realCorrect+'/'+realAnswered;
  document.getElementById('pf').style.width=ALL.length?Math.round(realAnswered/ALL.length*100)+'%':'0%';
  document.getElementById('pl').textContent=realAnswered+' из '+ALL.length+' отвечено';
  if(!studyMode&&realAnswered===ALL.length){
    const p=Math.round(realCorrect/ALL.length*100);
    const msg=p>=85?'🎯 Отличная подготовка! Готов к экзамену.':p>=65?'📚 Хорошо — повтори слабые темы.':'🔁 Перечитай разборы и попробуй снова.';
    document.getElementById('qs').insertAdjacentHTML('beforeend',`<div class="final"><div style="font-size:24px;font-weight:700;margin-bottom:8px">${realCorrect}/${ALL.length} — ${p}%</div><div style="font-size:14px;color:#444">${msg}</div></div>`);
  }
}
